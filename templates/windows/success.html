<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connected</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f3f3f3;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dialog {
    background: #fff;
    border: 1px solid #d1d1d1;
    border-radius: 4px;
    max-width: 340px;
    padding: 32px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  }
  .icon { width: 56px; height: 56px; background: #107c10; border-radius: 50%;
          display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  .title { font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
  .sub { font-size: 13px; color: #666; }
</style>
</head>
<body>
<div class="dialog">
  <div class="icon">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <path d="M5 14l7 7 11-11" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="title">Successfully Connected</div>
  <div class="sub">You are now connected to the network.</div>
</div>
</body>
</html>
